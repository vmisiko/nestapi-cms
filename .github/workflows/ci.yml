name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Runs the same rules as `npm run lint` without its `--fix`, so CI
        # reports failures instead of silently rewriting files.
        run: npx eslint "{src,seeds,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

  test:
    name: "test (known-failing, not blocking)"
    runs-on: ubuntu-latest
    # Known baseline as of 2026-09-24: 10 of 52 test suites (23 of 481 tests)
    # fail, tracked as backlog item B3 in docs/PENDING-WORK.md — mostly
    # outdated mocks (e.g. IMemberRepository gained `previewBulkImport` and
    # existing mocks weren't updated). This job runs the real suite and
    # reports it, but does not block merges until B3 brings it to green — at
    # that point, drop `continue-on-error` here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
