name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    name: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Runs the same rules as `npm run lint` without its `--fix`, so CI
        # reports failures instead of silently rewriting files.
        run: npx eslint "{src,seeds,apps,libs,test}/**/*.ts"

      - name: Build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    # B3 (docs/PENDING-WORK.md) brought the suite to green on 2026-09-24:
    # 54/54 suites, 579/579 tests. No longer continue-on-error — a real
    # regression should block merges.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test
